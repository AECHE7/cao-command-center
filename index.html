<!DOCTYPE html>
<html lang="en" class="h-full bg-slate-950">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CAO Command Center</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/@phosphor-icons/web"></script>
<script>
tailwind.config = { theme:{ extend:{ colors:{ clsu:{ green:'#006633', gold:'#FFC000' } } } } };
</script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap');
body{ font-family:'Inter',sans-serif; }
.skeleton{ position:relative; overflow:hidden; background:#1e293b; border-radius:.75rem; }
.skeleton::after{ content:''; position:absolute; inset:0;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.06),transparent); animation:sh 1.4s infinite; }
@keyframes sh{ 100%{ transform:translateX(100%); } }
.tab-on{ background:#006633; color:#fff; }
.tab-off{ color:#94a3b8; }
@media (prefers-reduced-motion:reduce){ .skeleton::after,.animate-spin{ animation:none; } }
</style>
</head>
<body class="h-full text-slate-100 antialiased flex flex-col selection:bg-clsu-green selection:text-white">

<!-- passcode gate -->
<div id="gate" class="fixed inset-0 bg-slate-950 z-50 flex items-center justify-center p-4">
  <div class="w-full max-w-sm bg-slate-900/90 border border-slate-700/60 p-8 rounded-3xl shadow-2xl text-center space-y-4 relative overflow-hidden">
    <div class="absolute -top-10 -right-10 w-32 h-32 bg-clsu-green rounded-full blur-3xl opacity-30 pointer-events-none"></div>
    <div class="w-16 h-16 bg-clsu-green text-clsu-gold rounded-2xl mx-auto flex items-center justify-center border border-clsu-gold/20 relative z-10">
      <i class="ph-bold ph-shield-star text-3xl"></i>
    </div>
    <div class="relative z-10">
      <h1 class="text-xl font-black text-white">CAO Command Center</h1>
      <p class="text-xs text-slate-400 mt-1 uppercase tracking-wider font-semibold">Officers only · CLSU</p>
    </div>
    <input type="password" id="gate-pc" placeholder="Admin passcode" autocomplete="off"
      class="w-full bg-slate-950 border border-slate-700 rounded-xl px-4 py-3 text-slate-200 font-mono text-center focus:outline-none focus:border-clsu-gold relative z-10"
      onkeydown="if(event.key==='Enter')unlock()">
    <p id="gate-err" class="hidden text-rose-400 text-xs font-semibold relative z-10"></p>
    <button onclick="unlock()" class="w-full bg-clsu-green hover:bg-green-800 text-white font-bold py-3 rounded-xl text-sm relative z-10">Enter</button>
  </div>
</div>

<!-- app -->
<div id="app" class="hidden flex-1 flex-col h-full overflow-hidden">
  <header class="bg-slate-900/90 border-b border-slate-800/80 px-4 sm:px-6 py-3 flex items-center justify-between shrink-0 backdrop-blur-md z-20">
    <div class="flex items-center gap-3">
      <div class="w-10 h-10 rounded-xl bg-clsu-green/20 border border-clsu-green/40 flex items-center justify-center text-clsu-gold">
        <i class="ph-bold ph-shield-star text-xl"></i>
      </div>
      <div>
        <h1 class="text-sm font-black text-white leading-none">Command Center</h1>
        <p id="hdr-date" class="text-[10px] text-clsu-gold font-bold tracking-wide mt-1">—</p>
      </div>
    </div>
    <div class="flex items-center gap-2">
      <input id="actor-input" placeholder="Acting as…" title="Your name, recorded on the Audit Log for actions you take"
        class="w-28 sm:w-36 bg-slate-950 border border-slate-800 text-xs text-slate-200 rounded-xl px-3 py-2 focus:outline-none focus:border-clsu-gold font-bold placeholder:text-slate-600"
        onchange="localStorage.setItem('cao_admin_actor', this.value.trim() || 'Officer')">
      <select id="group-filter" onchange="reloadActive()" class="bg-slate-950 border border-slate-800 text-xs text-slate-200 rounded-xl px-3 py-2 focus:outline-none focus:border-clsu-gold font-bold">
        <option>All Groups</option>
      </select>
      <button onclick="reloadActive()" title="Refresh" class="p-2.5 rounded-xl bg-slate-800 hover:bg-slate-700 border border-slate-700">
        <i id="refresh-ic" class="ph-bold ph-arrows-clockwise text-base text-emerald-400"></i>
      </button>
      <button onclick="lock()" title="Lock" class="p-2.5 rounded-xl bg-slate-800 hover:bg-slate-700 border border-slate-700 text-slate-400 hover:text-rose-400">
        <i class="ph-bold ph-lock-key text-base"></i>
      </button>
    </div>
  </header>

  <!-- tabs -->
  <nav class="bg-slate-900/60 border-b border-slate-800/60 px-2 sm:px-6 flex gap-1 shrink-0 overflow-x-auto">
    <button data-tab="overview"    onclick="switchTab('overview')"    class="tab-btn tab-on  px-4 py-3 text-xs font-bold rounded-t-lg whitespace-nowrap flex items-center gap-1.5"><i class="ph-bold ph-broadcast"></i> Live</button>
    <button data-tab="roster"      onclick="switchTab('roster')"      class="tab-btn tab-off px-4 py-3 text-xs font-bold rounded-t-lg whitespace-nowrap flex items-center gap-1.5"><i class="ph-bold ph-users-three"></i> Roster</button>
    <button data-tab="absentees"   onclick="switchTab('absentees')"   class="tab-btn tab-off px-4 py-3 text-xs font-bold rounded-t-lg whitespace-nowrap flex items-center gap-1.5"><i class="ph-bold ph-warning-circle"></i> Absentees</button>
    <button data-tab="leaderboard" onclick="switchTab('leaderboard')" class="tab-btn tab-off px-4 py-3 text-xs font-bold rounded-t-lg whitespace-nowrap flex items-center gap-1.5"><i class="ph-bold ph-trophy"></i> Leaderboard</button>
    <button data-tab="tasks"       onclick="switchTab('tasks')"       class="tab-btn tab-off px-4 py-3 text-xs font-bold rounded-t-lg whitespace-nowrap flex items-center gap-1.5"><i class="ph-bold ph-list-checks"></i> Tasks</button>
    <button data-tab="excuses"     onclick="switchTab('excuses')"     class="tab-btn tab-off px-4 py-3 text-xs font-bold rounded-t-lg whitespace-nowrap flex items-center gap-1.5"><i class="ph-bold ph-note-pencil"></i> Excuses</button>
    <button data-tab="notify"      onclick="switchTab('notify')"      class="tab-btn tab-off px-4 py-3 text-xs font-bold rounded-t-lg whitespace-nowrap flex items-center gap-1.5"><i class="ph-bold ph-bell"></i> Notify</button>
    <button data-tab="members"     onclick="switchTab('members')"     class="tab-btn tab-off px-4 py-3 text-xs font-bold rounded-t-lg whitespace-nowrap flex items-center gap-1.5"><i class="ph-bold ph-identification-badge"></i> Members</button>
    <button data-tab="audit"       onclick="switchTab('audit')"       class="tab-btn tab-off px-4 py-3 text-xs font-bold rounded-t-lg whitespace-nowrap flex items-center gap-1.5"><i class="ph-bold ph-clipboard-text"></i> Audit Log</button>
    <button data-tab="export"      onclick="switchTab('export')"      class="tab-btn tab-off px-4 py-3 text-xs font-bold rounded-t-lg whitespace-nowrap flex items-center gap-1.5"><i class="ph-bold ph-download-simple"></i> Export</button>
  </nav>

  <main class="flex-1 overflow-y-auto p-4 sm:p-6 max-w-5xl mx-auto w-full">
    <div id="panel-overview"></div>
    <div id="panel-roster" class="hidden"></div>
    <div id="panel-absentees" class="hidden"></div>
    <div id="panel-leaderboard" class="hidden"></div>
    <div id="panel-tasks" class="hidden"></div>
    <div id="panel-excuses" class="hidden"></div>
    <div id="panel-notify" class="hidden"></div>
    <div id="panel-members" class="hidden"></div>
    <div id="panel-audit" class="hidden"></div>
    <div id="panel-export" class="hidden"></div>
  </main>
</div>

<script>
const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbxRGyI9NNg0B-r5qAfeArlCr6rejnFwwgUO133XUa3k3wKYnDTZ6YmGSqDq-i9tVPGo/exec";
let adminPc = sessionStorage.getItem('cao_admin_pc') || "";
let activeTab = "overview";
const loaded = {}; // tab -> true once fetched

window.onload = () => { if (adminPc) unlock(true); };

/* ── gate ── */
async function unlock(silent){
  if (!silent){
    adminPc = document.getElementById('gate-pc').value.trim();
    if (!adminPc) return;
  }
  // validate by hitting overview once
  try {
    const data = await api('adminOverview');
    if (data.error === "BAD_ADMIN_PASSCODE"){
      const e = document.getElementById('gate-err'); e.innerText = "Wrong passcode."; e.classList.remove('hidden');
      return;
    }
    sessionStorage.setItem('cao_admin_pc', adminPc);
    document.getElementById('gate').classList.add('hidden');
    document.getElementById('app').classList.remove('hidden');
    document.getElementById('app').classList.add('flex');
    document.getElementById('actor-input').value = localStorage.getItem('cao_admin_actor') || '';
    populateGroups(data.groups);
    renderOverview(data);
    loaded.overview = true;
  } catch(e){
    const el = document.getElementById('gate-err'); el.innerText = "Can't reach the server."; el.classList.remove('hidden');
  }
}
function lock(){
  sessionStorage.removeItem('cao_admin_pc'); adminPc = "";
  location.reload();
}

/* ── api helper ── */
async function api(requestType, extra){
  const params = new URLSearchParams(Object.assign({ requestType, pc: adminPc, actor: getActor() }, extra || {}));
  const res = await fetch(`${WEB_APP_URL}?${params.toString()}`);
  return res.json();
}
function getActor(){ return localStorage.getItem('cao_admin_actor') || 'Officer'; }
function group(){ return document.getElementById('group-filter').value; }
function populateGroups(groups){
  if (!groups) return;
  const sel = document.getElementById('group-filter');
  const cur = sel.value;
  sel.innerHTML = groups.map(g=>`<option ${g===cur?'selected':''}>${g}</option>`).join('');
}

/* ── tabs ── */
function switchTab(tab){
  activeTab = tab;
  document.querySelectorAll('.tab-btn').forEach(b=>{
    const on = b.dataset.tab === tab;
    b.className = "tab-btn " + (on?'tab-on':'tab-off') + " px-4 py-3 text-xs font-bold rounded-t-lg whitespace-nowrap flex items-center gap-1.5";
  });
  ['overview','roster','absentees','leaderboard','tasks','excuses','notify','members','audit','export'].forEach(t=>{
    document.getElementById('panel-'+t).classList.toggle('hidden', t!==tab);
  });
  if (!loaded[tab]) reloadActive();
}
function reloadActive(){
  const ic = document.getElementById('refresh-ic'); ic.classList.add('animate-spin');
  const done = ()=> setTimeout(()=>ic.classList.remove('animate-spin'), 600);
  if (activeTab==='overview') loadOverview().finally?.(done); else
  if (activeTab==='roster') loadRoster().finally?.(done); else
  if (activeTab==='absentees') loadAbsentees().finally?.(done); else
  if (activeTab==='leaderboard') loadLeaderboard().finally?.(done); else
  if (activeTab==='tasks') loadTasks().finally?.(done); else
  if (activeTab==='excuses') loadExcuses().finally?.(done); else
  if (activeTab==='notify') loadNotify().finally?.(done); else
  if (activeTab==='members') loadMembers().finally?.(done); else
  if (activeTab==='audit') loadAuditLog().finally?.(done); else
  if (activeTab==='export') { renderExportForm(); done(); }
}
function skeleton(el, n){
  document.getElementById(el).innerHTML =
    '<div class="space-y-3">' + Array(n||4).fill('<div class="skeleton h-16"></div>').join('') + '</div>';
}

/* ═══ OVERVIEW (Live) ═══ */
async function loadOverview(){
  skeleton('panel-overview', 4);
  const data = await api('adminOverview', { group: group() });
  if (data.error){ document.getElementById('panel-overview').innerHTML = errBox(data.message); return; }
  populateGroups(data.groups); renderOverview(data); loaded.overview = true;
}
function renderOverview(d){
  document.getElementById('hdr-date').innerText = d.date;
  const c = d.counts;
  const stat = (label,val,cls,ic)=>`
    <div class="bg-slate-900/80 border border-slate-800 rounded-2xl p-4 text-center">
      <i class="ph-duotone ${ic} text-2xl ${cls} mb-1"></i>
      <p class="text-2xl font-black text-white">${val}</p>
      <p class="text-[9px] text-slate-400 font-bold uppercase tracking-wider">${label}</p>
    </div>`;

  const liveRows = d.liveNow.length ? d.liveNow.map(s=>`
    <div class="p-3 flex items-center justify-between text-xs border-b border-slate-800/60 last:border-0">
      <div class="flex items-center gap-3">
        <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
        <div><p class="font-bold text-slate-200">${s.name}</p>
        <p class="text-[10px] text-slate-500">${s.group}${s.sub?' · '+s.sub:''}</p></div>
      </div>
      <div class="flex items-center gap-2">
        ${s.checkinPhoto?`<a href="${s.checkinPhoto}" target="_blank" rel="noopener" title="View checkin photo" class="text-slate-500 hover:text-clsu-gold"><i class="ph-bold ph-camera text-sm"></i></a>`:''}
        <div class="text-right">
          <p class="font-mono text-emerald-400">since ${s.since}</p>
          ${s.late?`<p class="text-[9px] text-amber-400 font-bold">${s.late}</p>`:''}
        </div>
      </div>
    </div>`).join('') :
    `<div class="text-center py-8"><i class="ph-duotone ph-door text-3xl text-slate-700"></i>
      <p class="text-xs text-slate-500 mt-2">Nobody is timed in right now.</p></div>`;

  const eventChips = d.events.length ? d.events.map(e=>`
    <span class="inline-flex items-center gap-1.5 text-[10px] font-bold px-2.5 py-1 rounded-lg bg-clsu-green/20 border border-clsu-green/40 text-emerald-300">
      <i class="ph-fill ph-calendar-check"></i> ${e.type}${e.title?' · '+e.title:''} <span class="text-slate-400">(${e.group}${e.callTime?' · '+e.callTime:''})</span>
    </span>`).join(' ') :
    `<span class="text-[11px] text-amber-400 font-semibold"><i class="ph-fill ph-warning"></i> No events scheduled today</span>`;

  document.getElementById('panel-overview').innerHTML = `
    <div class="mb-4 flex flex-wrap gap-2">${eventChips}</div>
    <div class="grid grid-cols-2 sm:grid-cols-5 gap-3 mb-6">
      ${stat('In room now', c.inRoom, 'text-emerald-400','ph-broadcast')}
      ${stat('Present', c.present, 'text-sky-400','ph-user-check')}
      ${stat('Late', c.late, 'text-amber-400','ph-clock-user')}
      ${stat('Absent', c.absent, 'text-rose-400','ph-user-minus')}
      ${stat('Roster', c.roster, 'text-slate-400','ph-users-three')}
    </div>
    <div class="bg-slate-900/80 border border-slate-800 rounded-3xl overflow-hidden">
      <div class="px-4 py-3 border-b border-slate-800 flex items-center justify-between">
        <h3 class="text-xs font-bold text-slate-400 uppercase tracking-wider flex items-center gap-2"><i class="ph-bold ph-broadcast text-emerald-400"></i> In the room now</h3>
        <span class="text-[10px] text-slate-500 font-mono">synced ${d.syncedAt}</span>
      </div>
      ${liveRows}
    </div>`;
}

/* ═══ ROSTER ═══ */
async function loadRoster(){
  skeleton('panel-roster', 5);
  const data = await api('adminRoster', { group: group() });
  if (data.error){ document.getElementById('panel-roster').innerHTML = errBox(data.message); return; }
  populateGroups(data.groups); renderRoster(data); loaded.roster = true;
}
function renderRoster(d){
  const section = (title, list, color, ic) => `
    <div class="bg-slate-900/80 border border-slate-800 rounded-3xl overflow-hidden">
      <div class="px-4 py-3 border-b border-slate-800 flex items-center justify-between">
        <h3 class="text-xs font-bold ${color} uppercase tracking-wider flex items-center gap-2"><i class="ph-bold ${ic}"></i> ${title}</h3>
        <span class="text-[10px] font-mono bg-slate-950 text-slate-400 px-2 py-0.5 rounded-full">${list.length}</span>
      </div>
      ${ list.length ? list.map(s=>`
        <div class="p-3 flex items-center justify-between text-xs border-b border-slate-800/50 last:border-0">
          <div><p class="font-bold text-slate-200">${s.name}</p><p class="text-[10px] text-slate-500">${s.group}${s.sub?' · '+s.sub:''}</p></div>
          <div class="text-right font-mono text-[10px] text-slate-400">
            ${s.in?`in ${s.in}`:''}${s.out?` · out ${s.out}`:''}${s.late?`<span class="text-amber-400 font-bold ml-1">${s.late}</span>`:''}
          </div>
        </div>`).join('') :
        `<p class="text-xs text-slate-600 text-center py-5">None</p>` }
    </div>`;
  document.getElementById('panel-roster').innerHTML = `
    <div class="grid gap-4">
      ${section('Present', d.present, 'text-sky-400','ph-user-check')}
      ${section('Late', d.late, 'text-amber-400','ph-clock-user')}
      ${section('Absent', d.absent, 'text-rose-400','ph-user-minus')}
    </div>`;
}

/* ═══ ABSENTEES ═══ */
async function loadAbsentees(){
  const win = document.getElementById('abs-window')?.value || 10;
  const thr = document.getElementById('abs-threshold')?.value || 70;
  skeleton('panel-absentees', 4);
  const [data, riskData] = await Promise.all([
    api('adminAbsentees', { group: group(), window: win, threshold: thr }),
    api('adminAtRisk', { group: group() })
  ]);
  if (data.error){ document.getElementById('panel-absentees').innerHTML = errBox(data.message); return; }
  populateGroups(data.groups); renderAbsentees(data, riskData); loaded.absentees = true;
}
function renderAtRisk(r){
  if (!r || r.error) return '';
  if (r.note) return `<div class="bg-slate-900/60 border border-slate-800 rounded-2xl px-4 py-2.5 mb-4 text-[11px] text-slate-500"><i class="ph-bold ph-info"></i> ${r.note}</div>`;
  if (!r.flagged || !r.flagged.length) return '';
  const rows = r.flagged.map(s=>`
    <div class="p-3 flex items-center justify-between text-xs border-b border-slate-800/50 last:border-0">
      <div><p class="font-bold text-slate-200">${s.name}</p><p class="text-[10px] text-slate-500">${s.group}${s.sub?' · '+s.sub:''}</p></div>
      <div class="text-right">
        <p class="font-mono font-bold text-orange-400">${s.baselineRate}% → ${s.recentRate}%</p>
        <p class="text-[9px] text-slate-500">missed ${s.recentMissed}/${s.recentTotal} recent events</p>
      </div>
    </div>`).join('');
  return `
    <div class="bg-gradient-to-br from-orange-950/40 to-slate-900/80 border border-orange-500/30 rounded-3xl overflow-hidden mb-4">
      <div class="px-4 py-3 border-b border-orange-500/20 flex items-center justify-between">
        <h3 class="text-xs font-bold text-orange-400 uppercase tracking-wider flex items-center gap-2"><i class="ph-bold ph-trend-down"></i> At risk for the next event (${r.flagged.length})</h3>
        <span class="text-[9px] text-slate-500">used to attend ${r.minBaselineRate}%+, dropped ${r.dropPts}+ pts</span>
      </div>
      ${rows}
    </div>`;
}
function renderAbsentees(d, riskData){
  const controls = `
    <div class="bg-slate-900/80 border border-slate-800 rounded-2xl p-4 mb-4 flex flex-wrap items-end gap-4">
      <div>
        <label class="block text-[10px] font-bold text-slate-400 uppercase tracking-wider mb-1">Below rate</label>
        <div class="flex items-center gap-2">
          <input id="abs-threshold" type="number" min="0" max="100" value="${d.threshold}" class="w-20 bg-slate-950 border border-slate-700 rounded-lg px-3 py-2 text-slate-200 font-mono text-sm focus:outline-none focus:border-clsu-gold">
          <span class="text-slate-400 text-sm font-bold">%</span>
        </div>
      </div>
      <div>
        <label class="block text-[10px] font-bold text-slate-400 uppercase tracking-wider mb-1">Last N events</label>
        <input id="abs-window" type="number" min="1" value="${d.window}" class="w-20 bg-slate-950 border border-slate-700 rounded-lg px-3 py-2 text-slate-200 font-mono text-sm focus:outline-none focus:border-clsu-gold">
      </div>
      <button onclick="loadAbsentees()" class="bg-clsu-green hover:bg-green-800 text-white font-bold px-4 py-2 rounded-lg text-xs">Apply</button>
      <p class="text-[10px] text-slate-500 ml-auto">Based on ${d.events} event(s)</p>
    </div>`;

  const list = d.watchlist.length ? d.watchlist.map(s=>`
    <div class="p-3.5 flex items-center justify-between text-xs border-b border-slate-800/50 last:border-0">
      <div><p class="font-bold text-slate-200">${s.name}</p>
        <p class="text-[10px] text-slate-500">${s.group}${s.sub?' · '+s.sub:''}${s.excused?` · <span class="text-sky-400 font-bold">${s.excused} excused</span>`:''}</p></div>
      <div class="flex items-center gap-3">
        <div class="w-20 bg-slate-950 rounded-full h-2 overflow-hidden border border-white/5">
          <div class="h-2 rounded-full ${s.rate<50?'bg-rose-500':'bg-amber-500'}" style="width:${s.rate}%"></div>
        </div>
        <span class="font-mono font-bold ${s.rate<50?'text-rose-400':'text-amber-400'} w-24 text-right">${s.attended}/${s.total} · ${s.rate}%</span>
      </div>
    </div>`).join('') :
    `<div class="text-center py-8"><i class="ph-duotone ph-confetti text-3xl text-emerald-500"></i>
      <p class="text-xs text-slate-400 mt-2">No one below ${d.threshold}%. Attendance looks healthy.</p></div>`;

  document.getElementById('panel-absentees').innerHTML = controls + renderAtRisk(riskData) + `
    <div class="bg-slate-900/80 border border-slate-800 rounded-3xl overflow-hidden">
      <div class="px-4 py-3 border-b border-slate-800"><h3 class="text-xs font-bold text-rose-400 uppercase tracking-wider flex items-center gap-2"><i class="ph-bold ph-warning-circle"></i> Watch list (${d.watchlist.length})</h3></div>
      ${list}
    </div>` + (d.note?`<p class="text-[11px] text-amber-400 mt-3 text-center">${d.note}</p>`:'');
}

/* ═══ LEADERBOARD ═══ */
let lbMetric = "hours";
async function loadLeaderboard(){
  skeleton('panel-leaderboard', 6);
  const data = await api('adminLeaderboard', { group: group(), metric: lbMetric, limit: 20 });
  if (data.error){ document.getElementById('panel-leaderboard').innerHTML = errBox(data.message); return; }
  populateGroups(data.groups); renderLeaderboard(data); loaded.leaderboard = true;
}
function setMetric(m){ lbMetric = m; loadLeaderboard(); }
function renderLeaderboard(d){
  const medal = r => r===1?'text-clsu-gold':r===2?'text-slate-300':r===3?'text-amber-600':'text-slate-600';
  const rows = d.leaders.length ? d.leaders.map(s=>`
    <div class="p-3.5 flex items-center justify-between text-xs border-b border-slate-800/50 last:border-0">
      <div class="flex items-center gap-3">
        <span class="font-black text-base w-7 text-center ${medal(s.rank)}">${s.rank<=3?'★':s.rank}</span>

      </div>
      <div id="exp-result"></div>
    </div>`;

async function doExport(mode){
  const from = document.getElementById('exp-from').value;
  const to = document.getElementById('exp-to').value;
  document.getElementById('exp-result').innerHTML = '<div class="skeleton h-12 mt-2"></div>';
  const data = await api('adminExport', { group: group(), from, to });
  if (data.error){ document.getElementById('exp-result').innerHTML = errBox(data.message); return; }
  if (!data.rows.length){ document.getElementById('exp-result').innerHTML = `<p class="text-xs text-amber-400 mt-2">No rows in that range.</p>`; return; }

  if (mode==='csv'){
    const headers = ['Date','Time','Student ID','Name','Group','Action','Hours','Late','Event ID','Category','Checkin Photo'];
    const lines = [headers.join(',')].concat(data.rows.map(r=>
      [r.date,r.time,r.id,csv(r.name),csv(r.group),r.action,r.hours,csv(r.late),r.event,csv(r.category),csv(r.checkinPhoto)].join(',')));
    const blob = new Blob([lines.join('\n')], { type:'text/csv' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `CAO_attendance_${from}_to_${to}.csv`;
    a.click(); URL.revokeObjectURL(a.href);
    document.getElementById('exp-result').innerHTML = `<p class="text-xs text-emerald-400 mt-2"><i class="ph-fill ph-check-circle"></i> Downloaded ${data.count} rows.</p>`;
  } else {
    const preview = data.rows.slice(0,12).map(r=>`
      <div class="p-2 flex items-center justify-between text-[11px] border-b border-slate-800/50 last:border-0 font-mono">
        <span class="text-slate-400">${r.date} ${r.time}</span>
        <span class="text-slate-200">${r.name}</span>
        <span class="${r.action==='Time IN'?'text-sky-400':'text-emerald-400'}">${r.action}</span>
        <span class="text-slate-500">${r.category||'—'}</span>
      </div>`).join('');
    document.getElementById('exp-result').innerHTML = `
      <p class="text-[11px] text-slate-400 mt-3 mb-1">${data.count} rows · showing first 12</p>
      <div class="bg-slate-950 rounded-xl border border-slate-800 overflow-hidden">${preview}</div>`;
  }
}
function csv(v){ v = String(v==null?'':v); return /[",\n]/.test(v) ? '"'+v.replace(/"/g,'""')+'"' : v; }

  const isEdit = !!m;
  const body = `
    <div class="p-5 space-y-3 max-h-[75vh] overflow-y-auto">
      <div class="grid grid-cols-2 gap-2">
        <div><label class="block text-[10px] font-bold text-slate-400 uppercase mb-1">Student ID</label>
          <input id="mm-id" value="${m?.id||''}" ${isEdit?'disabled':''} placeholder="24-XXXX" class="w-full bg-slate-950 border border-slate-700 rounded-lg px-3 py-2 text-slate-200 text-xs font-mono focus:outline-none focus:border-clsu-gold ${isEdit?'opacity-50':''}"></div>
        <div><label class="block text-[10px] font-bold text-slate-400 uppercase mb-1">Status</label>
          <select id="mm-status" class="w-full bg-slate-950 border border-slate-700 rounded-lg px-3 py-2 text-slate-200 text-xs focus:outline-none focus:border-clsu-gold">
            <option ${m?.status!=='Inactive'?'selected':''}>Active</option><option ${m?.status==='Inactive'?'selected':''}>Inactive</option>
          </select></div>
      </div>
      <div class="grid grid-cols-2 gap-2">
        <div><label class="block text-[10px] font-bold text-slate-400 uppercase mb-1">First name</label>
          <input id="mm-first" value="${m?.firstName||''}" class="w-full bg-slate-950 border border-slate-700 rounded-lg px-3 py-2 text-slate-200 text-xs focus:outline-none focus:border-clsu-gold"></div>
        <div><label class="block text-[10px] font-bold text-slate-400 uppercase mb-1">Last name</label>
          <input id="mm-last" value="${m?.lastName||''}" class="w-full bg-slate-950 border border-slate-700 rounded-lg px-3 py-2 text-slate-200 text-xs focus:outline-none focus:border-clsu-gold"></div>
      </div>
      <div class="grid grid-cols-2 gap-2">
        <div><label class="block text-[10px] font-bold text-slate-400 uppercase mb-1">Group</label>
          <input id="mm-group" value="${m?.group||''}" placeholder="Maestro Singers" class="w-full bg-slate-950 border border-slate-700 rounded-lg px-3 py-2 text-slate-200 text-xs focus:outline-none focus:border-clsu-gold"></div>
        <div><label class="block text-[10px] font-bold text-slate-400 uppercase mb-1">Section</label>
          <input id="mm-sub" value="${m?.sub||''}" placeholder="Bass" class="w-full bg-slate-950 border border-slate-700 rounded-lg px-3 py-2 text-slate-200 text-xs focus:outline-none focus:border-clsu-gold"></div>
      </div>
      <div><label class="block text-[10px] font-bold text-slate-400 uppercase mb-1">Default call time</label>
        <input id="mm-calltime" value="${m?.callTime||''}" placeholder="17:00" class="w-full bg-slate-950 border border-slate-700 rounded-lg px-3 py-2 text-slate-200 text-xs font-mono focus:outline-none focus:border-clsu-gold"></div>
      <div><label class="block text-[10px] font-bold text-slate-400 uppercase mb-1">Email</label>
        <input id="mm-email" type="email" value="${m?.email||''}" class="w-full bg-slate-950 border border-slate-700 rounded-lg px-3 py-2 text-slate-200 text-xs focus:outline-none focus:border-clsu-gold"></div>
      <div><label class="block text-[10px] font-bold text-slate-400 uppercase mb-1">Contact number</label>
        <input id="mm-contact" value="${m?.contact||''}" class="w-full bg-slate-950 border border-slate-700 rounded-lg px-3 py-2 text-slate-200 text-xs focus:outline-none focus:border-clsu-gold"></div>
      <div class="grid grid-cols-2 gap-2">
        <div><label class="block text-[10px] font-bold text-slate-400 uppercase mb-1">Emergency name</label>
          <input id="mm-em-name" value="${m?.emergencyName||''}" class="w-full bg-slate-950 border border-slate-700 rounded-lg px-3 py-2 text-slate-200 text-xs focus:outline-none focus:border-clsu-gold"></div>
        <div><label class="block text-[10px] font-bold text-slate-400 uppercase mb-1">Emergency number</label>
          <input id="mm-em-phone" value="${m?.emergencyPhone||''}" class="w-full bg-slate-950 border border-slate-700 rounded-lg px-3 py-2 text-slate-200 text-xs focus:outline-none focus:border-clsu-gold"></div>
      </div>
      <p id="mm-msg" class="text-[11px] text-center"></p>
      <div class="flex gap-2 pt-1">
        <button onclick="saveMember('${id||''}', this)" class="flex-1 bg-clsu-green hover:bg-green-800 text-white font-bold py-2.5 rounded-xl text-xs">${isEdit?'Save changes':'Add member'}</button>
        <button onclick="closeMemberModal()" class="flex-1 bg-slate-800 hover:bg-slate-700 text-slate-300 font-bold py-2.5 rounded-xl text-xs">Cancel</button>
      </div>
    </div>`;

  let modal = document.getElementById('member-modal');
  if (!modal){
    modal = document.createElement('div');
    modal.id = 'member-modal';
    modal.className = 'fixed inset-0 bg-slate-950/90 backdrop-blur-md z-[80] flex items-center justify-center p-4 overflow-y-auto';
    document.body.appendChild(modal);
  }
  modal.innerHTML = `<div class="bg-slate-900 border border-slate-700 rounded-3xl w-full max-w-md my-auto shadow-2xl">
    <div class="flex items-center justify-between px-5 py-3 border-b border-slate-800">
      <h3 class="text-sm font-black text-white">${isEdit?'Edit member':'Add member'}</h3>
      <button onclick="closeMemberModal()" class="w-8 h-8 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-400 flex items-center justify-center"><i class="ph-bold ph-x"></i></button>
    </div>
    ${body}
  </div>`;
  modal.classList.remove('hidden');
}
function closeMemberModal(){ const m = document.getElementById('member-modal'); if (m) m.remove(); }

async function saveMember(id, btn){
  const msg = document.getElementById('mm-msg');
  const original = id ? membersCache.find(x => x.id === id) : null;
  const payload = {
    id: id || document.getElementById('mm-id').value.trim(),
    firstName: document.getElementById('mm-first').value.trim(),
    lastName: document.getElementById('mm-last').value.trim(),
    group: document.getElementById('mm-group').value.trim(),
    sub: document.getElementById('mm-sub').value.trim(),
    callTime: document.getElementById('mm-calltime').value.trim(),
    email: document.getElementById('mm-email').value.trim(),
    contact: document.getElementById('mm-contact').value.trim(),
    emergencyName: document.getElementById('mm-em-name').value.trim(),
    emergencyPhone: document.getElementById('mm-em-phone').value.trim(),
    status: document.getElementById('mm-status').value
  };
  btn.disabled = true; btn.innerText = 'Saving…';
  const endpoint = id ? 'adminUpdateMember' : 'adminAddMember';
  const data = await api(endpoint, payload);
  if (data.success){
    if (id && original && original.status !== payload.status) {
      await api('adminSetMemberStatus', { id, status: payload.status });
    }
    closeMemberModal(); loadMembers();
  } else {
    btn.disabled = false; btn.innerText = id?'Save changes':'Add member';
    msg.innerHTML = `<span class="text-rose-400">${data.message||'Failed to save.'}</span>`;
  }
}
async function toggleMemberStatus(id, currentStatus, btn){
  const next = currentStatus.toLowerCase() === 'inactive' ? 'Active' : 'Inactive';
  btn.disabled = true;
  const data = await api('adminSetMemberStatus', { id, status: next });
  if (data.success) loadMembers(); else btn.disabled = false;
}
async function resetMemberPin(id, btn){
  if (!confirm("Clear this member's PIN? They will need to register a new one.")) return;
  btn.disabled = true;
  const data = await api('adminResetPin', { id });
  btn.disabled = false;
  if (data.success) alert(data.message);
}

/* ═══ AUDIT LOG ═══ */
async function loadAuditLog(){
  skeleton('panel-audit', 5);
  const data = await api('adminAuditLog');
  if (data.error){ document.getElementById('panel-audit').innerHTML = errBox(data.message); return; }
  renderAuditLog(data); loaded.audit = true;
}
function renderAuditLog(d){
  if (d.note){ document.getElementById('panel-audit').innerHTML = `<p class="text-xs text-slate-500 text-center py-8">${d.note}</p>`; return; }
  const rows = d.rows.length ? d.rows.map(r => `
    <div class="p-3 flex items-center justify-between text-xs border-b border-slate-800/50 last:border-0">
      <div class="overflow-hidden">
        <p class="font-bold text-slate-200">${r.action} <span class="text-slate-500 font-normal">${r.target?'· '+r.target:''}</span></p>
        <p class="text-[10px] text-slate-500 truncate">${r.details||''}</p>
      </div>
      <div class="text-right shrink-0 ml-3">
        <p class="text-[11px] font-bold text-clsu-gold">${r.actor}</p>
        <p class="text-[9px] text-slate-500 font-mono">${r.when}</p>
      </div>
    </div>`).join('') : `<p class="text-xs text-slate-600 text-center py-8">No actions recorded yet.</p>`;
  document.getElementById('panel-audit').innerHTML = `
    <div class="bg-slate-900/80 border border-slate-800 rounded-3xl overflow-hidden">
      <div class="px-4 py-3 border-b border-slate-800"><h3 class="text-xs font-bold text-slate-400 uppercase tracking-wider flex items-center gap-2"><i class="ph-bold ph-clipboard-text"></i> Recent officer actions</h3></div>
      ${rows}
    </div>`;
}

/* ── shared ── */
function errBox(msg){
  return `<div class="bg-rose-500/10 border border-rose-500/30 text-rose-400 text-xs rounded-xl p-4 text-center font-medium">${msg||'Something went wrong.'}</div>`;
}
</script>
</body>
